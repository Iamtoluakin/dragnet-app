<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Everyday people learning to make fair and responsible choices</title>
  <desc id="desc">A friendly cartoon group portrait of a police officer, teacher, banker, engineer, civil servant, nurse, and student.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a35"/>
      <stop offset=".55" stop-color="#11142a"/>
      <stop offset="1" stop-color="#211742"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3989ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a45bff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3578e5" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#9a5cff" stop-opacity=".28"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <style>
      .character { filter: drop-shadow(0 2px 7px rgba(90, 126, 255, .15)); }
      .character path, .character ellipse, .character rect, .character circle {
        fill: none !important;
        stroke: currentColor;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .police { color: #9bc5ff; }
      .teacher { color: #d3afff; }
      .banker { color: #aebeff; }
      .engineer { color: #8fdbd1; }
      .civil-servant { color: #c0c5ff; }
      .nurse { color: #9cdeed; }
      .student { color: #ffd38e; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <ellipse cx="245" cy="140" rx="220" ry="150" fill="#347cff" opacity=".2" filter="url(#soft)"/>
